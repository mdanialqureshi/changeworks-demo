name: Tests
description: Add tests for behaviour that is not yet covered.
title: "test: "
body:
  - type: input
    id: module
    attributes:
      label: Module
      description: For example `src/quillstack_billing/dunning.py`.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Behaviour
      description: The behaviour the new tests must pin down.
    validations:
      required: true
