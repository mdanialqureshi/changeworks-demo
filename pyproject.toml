[project]
name = "quillstack-billing"
version = "0.9.0"
description = "Invoicing library and CLI for Quillstack (fictional; course bench target)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "python-dateutil==2.9.0.post0",
]

[project.scripts]
quill = "quillstack_billing.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 79
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
